# Overrides locais do quickstart.
#
# O Docker Compose carrega este arquivo automaticamente, em adição ao
# docker-compose.yml, sempre que você roda `docker compose ...` a partir de
# docker/. Por isso ele é o lugar seguro para customizações locais: o
# docker-compose.yml é reescrito pelo workflow de release do Canary, este não.
#
# Aqui:
#
# 1) Copia o config.lua do repositório (../config.lua) para dentro do container
#    antes do start.sh. O arquivo é montado em /config-src e não direto em
#    /canary/config.lua, porque o start.sh substitui o arquivo via `mv`, o que
#    quebra bind mount de arquivo único. Copiando, /canary/config.lua continua
#    sendo um arquivo normal e as edições do repositório (rates, etc.) passam a
#    valer. O start.sh ainda sobrescreve as chaves de infraestrutura (ip, portas,
#    banco, serverName) a partir das variáveis de ambiente.
#
# 2) Desliga o aprendizado obrigatório de spells (toggleLearnSpells = false em
#    /canary/config.lua). Assim as spells passam a valer por nível/vocação, sem
#    precisar ir a um NPC treinador — útil em servidor de teste quando o level é
#    alterado direto pelo admin do MyAAC.
#
# Os dois ajustes rodam ANTES do /canary/start.sh, que apenas reescreve um
# conjunto fixo de chaves (e não mexe nos rates nem em toggleLearnSpells), então
# as alterações são preservadas.
# 3) Monta o items.xml do repositorio no container do myaac. O MyAAC le os
#    itens de data_path/items/items.xml (ver system/src/Items.php); sem isso o
#    plugin market-seeder nao consegue resolver nome -> id. Montamos apenas o
#    items.xml (nao o datapack inteiro).
#
# 4) Liga o crond do container e agenda o market-seeder as 03:00 (horario local),
#    via crontab do root. O crond do busybox so executa o crontab do root, entao
#    a entrada chama um wrapper que roda o PHP como www-data (para o cache/log
#    ficar com o dono do php-fpm). O fuso do container e fixado via TZ (nao ha
#    tzdata; usamos o formato POSIX: America/Fortaleza = UTC-3, sem horario de
#    verao).
services:
  server:
    volumes:
      - '../config.lua:/config-src/config.lua:ro'
      - '../data/stages.lua:/canary/data/stages.lua:ro'
      # 5) Entrega de itens pedidos pelo site (plugin give-item do MyAAC). O MyAAC
      #    grava os pedidos na tabela myaac_item_delivery (mesmo banco); este
      #    script Lua entrega para o personagem, online ou no proximo login.
      #    O datapack core do servidor e carregado de /canary/data (coreDirectory
      #    no config.lua), por isso o arquivo vai para scripts/globalevents.
      - '../data/scripts/globalevents/myaac_item_delivery.lua:/canary/data/scripts/globalevents/myaac_item_delivery.lua:ro'
    entrypoint:
      - /bin/sh
      - -c
      - >-
        cp /config-src/config.lua /canary/config.lua;
        sed -i -E 's/^[[:space:]]*toggleLearnSpells[[:space:]]*=.*/toggleLearnSpells = false/' /canary/config.lua || true;
        grep -qE '^[[:space:]]*toggleLearnSpells' /canary/config.lua || echo 'toggleLearnSpells = false' >>/canary/config.lua;
        exec /canary/start.sh

  myaac:
    environment:
      # Fuso do container (afeta o horario do cron). UTC-3 = America/Fortaleza.
      TZ: "${MYAAC_TZ:-BRT3}"
    volumes:
      - '../data/items/items.xml:/canary/data/items/items.xml:ro'
      - './quickstart/myaac/market-seeder-cron.sh:/cron-src/market-seeder-cron.sh:ro'
    command:
      - sh
      - -c
      - >-
        install -m 755 /cron-src/market-seeder-cron.sh /usr/local/bin/market-seeder-cron.sh;
        grep -q 'market-seeder-cron.sh' /etc/crontabs/root || printf '\n0 3 * * * /usr/local/bin/market-seeder-cron.sh\n' >> /etc/crontabs/root;
        crond -b -l 8 -L /var/www/html/system/logs/crond.log;
        nginx && exec php-fpm
